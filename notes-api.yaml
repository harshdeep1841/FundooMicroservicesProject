apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-deploy
  namespace: fundoo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-api
  template:
    metadata:
      labels:
        app: notes-api
    spec:
      containers:
        - name: notes
          image: harshdeep0406/fundoo-notes:live
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: notes-service
  namespace: fundoo
spec:
  type: ClusterIP
  selector:
    app: notes-api
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
