apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deploy
  namespace: fundoo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: gateway
          image: harshdeep0406/fundoo-gateway:live
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-public-service
  namespace: fundoo
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
